[project]
name = "aether"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "JonathanJayaputra", email = "jjayaput@terpmail.umd.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "astropy>=8.0.2",
    "matplotlib>=3.11.2",
    "merlin-spectra>=0.0.35",
    "silmaril",
    "yt<4.4.3",
]

[project.scripts]
aether = "aether:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
silmaril = { git = "https://github.com/aetherumd/silmaril", branch = "feature/star-by-star" }
